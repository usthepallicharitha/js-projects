<!DOCTYPE html>
<html lang="en">
<head>
<title></title>
</head>
<body>
    
<input type="numbers" id="celcius" placeholder="enter celcius">
<button type="button" onclick="convert()"> convert </button>
<h1 id="result"></h1>
<script>

function convert(){
var c=document.getElementById("celcius").value;
var f=(c * 9/5)+32;
document.getElementById("result").innerText=c+"c = "+f+"f"

}

</script>

</body>
</html>
