<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Password Generator</title>

  <style>
    body{
      font-family: Arial;
      text-align: center;
      margin-top: 100px;
      background: #f2f2f2;
    }

    .box{
      background: white;
      width: 300px;
      margin: auto;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 10px gray;
    }

    input{
      width: 90%;
      padding: 10px;
      font-size: 18px;
      margin-bottom: 15px;
      text-align: center;
    }

    button{
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
    }
  </style>
</head>

<body>

<div class="box">

  <h2>Password Generator</h2>

  <input type="text" id="password" readonly>

  <br>

  <button onclick="generatePassword()">
    Generate Password
  </button>

</div>

<script>

function generatePassword(){

  let chars =
  "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789@#$%&*";

  let password = "";

  for(let i = 0; i < 8; i++){

    let randomIndex =
    Math.floor(Math.random() * chars.length);

    password += chars[randomIndex];
  }

  document.getElementById("password").value = password;
}

</script>

</body>
</html>
